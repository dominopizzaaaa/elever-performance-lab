services:
  - type: web
    name: elever-performance-lab-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000
